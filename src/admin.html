<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="nav">
        <a href="/" class="brand">Express Auth Demo</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/admin" data-auth="admin">Admin</a>
            <a href="/profile" data-auth="in">Profile</a>
            <a href="/login" data-auth="out">Login</a>
            <button type="button" data-auth="in" data-logout>Logout</button>
        </div>
    </nav>

    <main>
        <div class="card wide">
            <p id="state" class="state">Checking your permissions...</p>

            <div id="panel" class="hidden">
                <h1>Admin panel</h1>
                <p class="subtitle">Manage every account registered on this server.</p>

                <div class="stats">
                    <div class="stat">
                        <span class="stat-value" id="statTotal">0</span>
                        <span class="stat-label">Total users</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statAdmins">0</span>
                        <span class="stat-label">Admins</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="statUsers">0</span>
                        <span class="stat-label">Regular users</span>
                    </div>
                </div>

                <div id="message" class="message"></div>

                <div class="toolbar">
                    <input type="search" id="search" placeholder="Search by name or email">
                    <select id="roleFilter">
                        <option value="">All roles</option>
                        <option value="admin">Admins only</option>
                        <option value="user">Users only</option>
                    </select>
                    <button type="button" class="btn secondary" id="reloadBtn">Reload</button>
                </div>

                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userRows"></tbody>
                </table>

                <p class="hint" id="tableState"></p>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</body>

</html>
