<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav class="nav">
        <a href="/" class="brand">Express Auth Demo</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/admin" data-auth="admin">Admin</a>
            <a href="/profile" data-auth="in">Profile</a>
            <a href="/login" data-auth="out">Login</a>
            <button type="button" data-auth="in" data-logout>Logout</button>
        </div>
    </nav>

    <main>
        <!-- Signed out: authenticate right here on the home page -->
        <div class="card" data-auth="out">
            <h1 id="heading">Welcome back</h1>
            <p class="subtitle" id="subtitle">Sign in to view your profile.</p>

            <div class="tabs">
                <button type="button" id="loginTab" class="active">Login</button>
                <button type="button" id="registerTab">Register</button>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm" novalidate>
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email"
                    required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Your password"
                    autocomplete="current-password" required>

                <button type="submit" class="btn">Login</button>
            </form>

            <form id="registerForm" class="hidden" novalidate>
                <label for="registerName">Name</label>
                <input type="text" id="registerName" name="name" placeholder="Jane Smith" autocomplete="name" required>

                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" name="email" placeholder="you@example.com" autocomplete="email"
                    required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" name="password" placeholder="At least 6 characters"
                    autocomplete="new-password" minlength="6" required>

                <button type="submit" class="btn">Create account</button>
            </form>
        </div>

        <!-- Signed in: show who you are plus the sample data fetcher -->
        <div class="card wide" data-auth="in">
            <div class="profile-header">
                <div class="avatar" id="homeAvatar"></div>
                <div>
                    <h1 id="homeName">Welcome</h1>
                    <p class="subtitle" id="homeEmail" style="margin: 0;"></p>
                    <span class="badge" id="homeRole"></span>
                </div>
            </div>

            <p class="subtitle" style="margin-top: 20px;">Fetch the sample records exposed at /api.</p>

            <div id="dataMessage" class="message"></div>

            <div class="actions">
                <button type="button" class="btn" id="fetchBtn">Fetch data</button>
                <a class="btn secondary" href="/profile" style="text-align: center; text-decoration: none;">My
                    profile</a>
            </div>

            <div class="actions" data-auth="admin">
                <a class="btn secondary" href="/admin" style="text-align: center; text-decoration: none;">Open admin
                    panel</a>
            </div>

            <pre class="data-output hidden" id="output"></pre>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/home.js"></script>
</body>

</html>
