<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
<style>
    *{
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}
body{
    margin: 0;
}

main{
    background-color: #f1f1f1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.txt{
    display: flex;
    flex-direction: column;
}

.material-symbols-outlined {
    font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
}

.youtube{
    margin: 25px 30px;
    width: 440px;
    height: 31px;
    display: flex;
}

.form{
    height: 100%;
    display: flex;
}

.form *{
    height: 23px;
}

.form input{
    width: 208px;
}

.blue{
    color: blue;
}

.logo{
    height: 30px;
}

.form button{
    background-color: #f8f8f8;
    height: 29px;
    padding: 0;
    border: 1px solid transparent;
    border-color: #d3d3d3;
    padding: 0px 25px;
}

.form button * {
    color: #333;
}
</style>
    <title>404 Not Found</title>
</head>
<body>
    <main>
        <div>
            <img src="https://www.gstatic.com/youtube/src/web/htdocs/img/monkey.png" alt="">
        </div>
        <div class="txt">
            <span>This page isn't available. Sorry about that.</span>
            <span>Try searching for something else.</span>
        </div>
        <div class="youtube">
            <a href="/">
                <span><img src="https://www.gstatic.com/youtube/img/branding/youtubelogo/2x/youtubelogo_50.png" alt="youtube" class="logo"></span>
                <span class="blue">RO</span>
            </a>
            <div class="form">
                <input type="text" name="" id="" placeholder="Search">
                <button>
                    <span class="material-symbols-outlined">
                        search
                    </span>
                </button>
            </div>
        </div>
    </main>
</body>
</html>
